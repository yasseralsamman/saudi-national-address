name: Data fix
description: Report a typo, a boundary correction, or a missing district.
title: "[data]: "
labels: ["data"]
body:
  - type: markdown
    attributes:
      value: |
        Use this for corrections to the dataset itself. Accurate fixes need a verifiable
        source, so please include one below.
  - type: dropdown
    id: kind
    attributes:
      label: Kind of fix
      options:
        - Name typo (Arabic or English)
        - Boundary / polygon correction
        - Missing district or city
        - Wrong relationship (region/city/district mismatch)
        - Other
    validations:
      required: true
  - type: input
    id: identifier
    attributes:
      label: district_id or city_id
      description: The 11-digit district_id, or the city_id, of the affected record.
      placeholder: "e.g. 10100003001 or 3"
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: Proposed change
      description: What is wrong now, and what should it be instead?
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Source / justification
      description: >
        A citation we can verify — Google Maps link, the SPL website, a government
        publication, etc. Fixes without a source cannot be merged.
    validations:
      required: true
